<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='cadastro-usuario.css') }}">
</head>

<body>

    <form action="{{ url_for('auth.cadastrar_usuario')}}" method="POST">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash {{ category}}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <h1>Cadastro de Usuário</h1><br>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" value="{{ form_data.nome if form_data else ''}}">

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" name="cpf" value="{{ form_data.cpf if form_data else ''}}">

        <label for="idade">Idade:</label>
        <input type="number" id="idade" name="idade" value="{{ form_data.idade if form_data else ''}}">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ form_data.email if form_data else ''}}">

        <label for="senha">Senha:</label>
        <div class="password-field">
        <input type="password" id="senha" name="senha" value="{{ form_data.senha if form_data else '' }}" placeholder="Digite sua senha">
            <span id="toggleSenha" class="toggle-password" title="Mostrar senha">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                    viewBox="0 0 24 24" fill="none"
                    stroke="#374151" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </span>
        </div><br><br>

        <label for="perfil">Perfil:</label>
        <select id="perfil" name="perfil">
            <option value="comum"
                {{ 'selected' if request.form.get('perfil', 'comum') == 'comum' else '' }}>
                Comum
            </option>
            <option value="admin"
                {{ 'selected' if request.form.get('perfil') == 'admin' else '' }}>
                Admin
            </option>
        </select><br><br>

        <button type="submit">Cadastrar</button><br><br>
        <a href="{{ url_for('auth.home') }}">Voltar a página home</a>
    </form>

    <script>
        document.addEventListener('DOMContentLoaded', function(){
        const cpfInput = document.getElementById('cpf');
        const senhaInput = document.getElementById('senha');
        const toggle = document.getElementById('toggleSenha');
        const eyeIcon = toggle.querySelector('svg');

        cpfInput.addEventListener('input', function () {
            let valor = this.value.replace(/\D/g, '');

            if (valor.length > 3)  valor = valor.slice(0, 3) + '.' + valor.slice(3);
            if (valor.length > 7)  valor = valor.slice(0, 7) + '.' + valor.slice(7);
            if (valor.length > 11) valor = valor.slice(0, 11) + '-' + valor.slice(11);
            if (valor.length > 14) valor = valor.slice(0, 14);

            this.value = valor;
        });

        toggle.addEventListener('click', function () {
            const visible = senhaInput.type === 'text';
            senhaInput.type = visible ? 'password' : 'text';
            eyeIcon.setAttribute('stroke', visible ? '#374151' : '#2563eb');
        });
    });
    </script>
</body>
</html>
